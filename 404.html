<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Школа доктора Шурова</title>
  <script>
    (function () {
      if (location.hostname === "www.doctorshurov.ru") {
        location.replace("https://doctorshurov.ru/" + location.search + location.hash);
        return;
      }
      var parts = location.pathname.split("/").filter(Boolean);
      var repo = location.hostname.endsWith("github.io") && parts[0] ? "/" + parts[0] + "/" : "/";
      location.replace(repo + location.search + location.hash);
    })();
  </script>
</head>
<body></body>
</html>
